# The GPS rally requires a persistent Node server; GitHub Pages cannot host it.
name: Validate server release
on:
  release:
    types: [published]
  workflow_dispatch: ~
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:rally
      - run: npm run lint:rally
      - run: npm run build
